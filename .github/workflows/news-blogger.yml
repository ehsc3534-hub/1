name: News to Blogger (1 hour after each post)
run-name: News to Blogger (${{ github.event_name }})

on:
  workflow_dispatch:
    inputs:
      chain:
        description: "Keep posting automatically? (false = only one post)"
        type: choice
        default: "true"
        options:
          - "true"
          - "false"
      delay_minutes:
        description: "Minutes to wait after a post before the next run starts"
        type: string
        default: "60"
  schedule:
    - cron: "17 */3 * * *"   # watchdog only: restarts the chain if it is not running

permissions:
  contents: write
  actions: write

concurrency:
  group: news-blogger
  cancel-in-progress: false

jobs:
  post:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      OLLAMA_MODEL: qwen2.5:3b
      DELAY: ${{ github.event.inputs.delay_minutes || '60' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip if another run is already active (watchdog only)
        id: guard
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo ${{ github.repository }} --workflow news-blogger.yml --limit 30 \
            --json status,databaseId \
            --jq '[.[] | select((.status=="in_progress" or .status=="queued" or .status=="waiting" or .status=="pending") and .databaseId != ${{ github.run_id }})] | length')
          echo "other active runs: $n"
          if [ "$n" -gt 0 ]; then echo "skip=true" >> "$GITHUB_OUTPUT"; fi

      - name: Check required secrets
        if: steps.guard.outputs.skip != 'true'
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
        run: |
          for v in CLIENT_ID CLIENT_SECRET REFRESH_TOKEN BLOG_ID; do
            if [ -z "${!v}" ]; then echo "::error::Missing secret: $v"; exit 1; fi
          done

      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip != 'true'
        with:
          python-version: "3.12"
          cache: pip

      - name: Install requirements
        if: steps.guard.outputs.skip != 'true'
        run: pip install -r requirements.txt

      - name: Cache AI model
        if: steps.guard.outputs.skip != 'true'
        uses: actions/cache@v4
        with:
          path: ~/ollama-models
          key: ollama-${{ env.OLLAMA_MODEL }}

      - name: Start local AI (Ollama)
        if: steps.guard.outputs.skip != 'true'
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          sudo systemctl stop ollama || true
          mkdir -p ~/ollama-models
          OLLAMA_MODELS=$HOME/ollama-models OLLAMA_NUM_PARALLEL=1 nohup ollama serve > ollama.log 2>&1 &
          for i in $(seq 1 40); do curl -s localhost:11434/api/tags >/dev/null && break; sleep 1; done
          ollama pull "$OLLAMA_MODEL"

      - name: Create one post
        id: run
        if: steps.guard.outputs.skip != 'true'
        run: python main.py
        env:
          CLIENT_ID: ${{ secrets.CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.REFRESH_TOKEN }}
          BLOG_ID: ${{ secrets.BLOG_ID }}
          SITE_NAME: ${{ secrets.SITE_NAME }}
          BANNER_468X60: ${{ secrets.BANNER_468X60 }}
          BANNER_300X250: ${{ secrets.BANNER_300X250 }}
          BANNER_320X50: ${{ secrets.BANNER_320X50 }}
          NATIVE_BANNER: ${{ secrets.NATIVE_BANNER }}
          AD_NATIVE: ${{ secrets.AD_NATIVE }}
          AD_BANNER: ${{ secrets.AD_BANNER }}
          AD_MULTITAG: ${{ secrets.AD_MULTITAG }}
          ADSENSE_ID: ${{ secrets.ADSENSE_ID }}

      - name: Save state
        if: always() && steps.guard.outputs.skip != 'true'
        run: |
          git config user.name "news-bot"
          git config user.email "news-bot@users.noreply.github.com"
          git add state.json
          git diff --cached --quiet || (git commit -m "state update" && git pull --rebase -q && git push)

      - name: Wait before the next post
        if: steps.run.outputs.next == 'true' && github.event.inputs.chain != 'false'
        run: |
          echo "Waiting ${DELAY} minutes before the next run..."
          sleep $(( DELAY * 60 ))

      - name: Trigger next run
        if: steps.run.outputs.next == 'true' && github.event.inputs.chain != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run news-blogger.yml --ref ${{ github.ref_name }} -f chain=true -f delay_minutes=${DELAY}
